{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">Product Catalog</h2>

<div class="row">
  {% for product in products %}
  <div class="col-md-4">
    <div class="card mb-4 shadow-sm">
      <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: contain;">
      <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text">{{ product.description }}</p>
        <p class="card-text"><strong>${{ "%.2f"|format(product.price) }}</strong></p>
        <p class="text-muted">Stock: {{ product.stock }}</p>
        <a href="{{ url_for('add_item', product_id=product.id) }}" class="btn btn-primary">Add to Cart</a>
      </div>
    </div>
  </div>
  
  {% endfor %}
</div>
{% endblock %}
