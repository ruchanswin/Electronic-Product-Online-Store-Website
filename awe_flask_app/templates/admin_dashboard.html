{% extends "layout.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Admin Dashboard</h2>
    <a href="{{ url_for('admin_statistics') }}" class="btn btn-primary">View Sales Statistics</a>
</div>

<form method="POST">
    <input type="hidden" name="action" value="update">
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Image URL</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
        {% for product in products %}
            <tr>
                <td><input class="form-control" name="name_{{ product.id }}" value="{{ product.name }}"></td>
                <td><input class="form-control" name="description_{{ product.id }}" value="{{ product.description }}"></td>
                <td><input class="form-control" name="price_{{ product.id }}" value="{{ product.price }}" type="number" step="0.01" min="0.01" required></td>
                <td><input class="form-control" name="stock_{{ product.id }}" value="{{ product.stock }}" type="number" min="0" required></td>
                <td><input class="form-control" name="image_{{ product.id }}" value="{{ product.image }}"></td>
                <td>
                    <form method="POST" style="display:inline">
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="delete_id" value="{{ product.id }}">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <button type="submit" class="btn btn-success">Save Changes</button>
</form>

<hr>

<h4>Add New Product</h4>
<form method="POST">
    <input type="hidden" name="action" value="add">
    <div class="row">
        <div class="col-md-2"><input name="new_name" class="form-control" placeholder="Product Name" required></div>
        <div class="col-md-3"><input name="new_description" class="form-control" placeholder="Description" required></div>
        <div class="col-md-2"><input name="new_price" type="number" step="0.01" min="0.01" class="form-control" placeholder="Price" required></div>
        <div class="col-md-2"><input name="new_stock" type="number" min="0" class="form-control" placeholder="Stock" required></div>
        <div class="col-md-2"><input name="new_image" class="form-control" placeholder="Image URL" required></div>
        <div class="col-md-1"><button type="submit" class="btn btn-primary">Add</button></div>
    </div>
</form>
{% endblock %}
