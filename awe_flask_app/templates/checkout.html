{% extends "layout.html" %}
{% block content %}
<h2>Checkout</h2>
<form method="POST" class="p-3 border rounded shadow-sm bg-light" id="checkoutForm" onsubmit="return validateForm()">
    <div class="mb-3">
        <label>Card Number</label>
        <input type="text" name="card" id="card" class="form-control" 
               pattern="^\d{4}-\d{4}-\d{4}-\d{4}$"
               title="Please enter a valid 16-digit card number in format: xxxx-xxxx-xxxx-xxxx"
               placeholder="xxxx-xxxx-xxxx-xxxx"
               maxlength="19"
               required>
        <div class="invalid-feedback" id="cardError"></div>
    </div>
    <div class="mb-3">
        <label>Expiry Date</label>
        <input type="text" name="expiry" id="expiry" class="form-control" 
               pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$"
               title="Please enter a valid expiry date in format: MM/YY"
               placeholder="MM/YY"
               maxlength="5"
               required>
        <div class="invalid-feedback" id="expiryError"></div>
    </div>
    <div class="mb-3">
        <label>CVV</label>
        <input type="text" name="cvv" id="cvv" class="form-control" 
               pattern="^\d{3,4}$"
               title="Please enter a valid 3 or 4 digit CVV"
               placeholder="Enter 3 or 4 digit CVV"
               maxlength="4"
               required>
        <div class="invalid-feedback" id="cvvError"></div>
    </div>
    <button type="submit" class="btn btn-primary">Place Order</button>
</form>

<script>
function validateForm() {
    const card = document.getElementById('card');
    const expiry = document.getElementById('expiry');
    const cvv = document.getElementById('cvv');
    const cardError = document.getElementById('cardError');
    const expiryError = document.getElementById('expiryError');
    const cvvError = document.getElementById('cvvError');
    let isValid = true;

    // Reset previous error messages
    cardError.textContent = '';
    expiryError.textContent = '';
    cvvError.textContent = '';
    card.classList.remove('is-invalid');
    expiry.classList.remove('is-invalid');
    cvv.classList.remove('is-invalid');

    // Card number validation
    const cardRegex = /^\d{4}-\d{4}-\d{4}-\d{4}$/;
    if (!cardRegex.test(card.value)) {
        cardError.textContent = 'Please enter a valid 16-digit card number in format: xxxx-xxxx-xxxx-xxxx';
        card.classList.add('is-invalid');
        isValid = false;
    }

    // Expiry date validation
    const expiryRegex = /^(0[1-9]|1[0-2])\/([0-9]{2})$/;
    if (!expiryRegex.test(expiry.value)) {
        expiryError.textContent = 'Please enter a valid expiry date in format: MM/YY';
        expiry.classList.add('is-invalid');
        isValid = false;
    } else {
        // Additional expiry date validation
        const [month, year] = expiry.value.split('/');
        const currentDate = new Date();
        const currentYear = currentDate.getFullYear() % 100;
        const currentMonth = currentDate.getMonth() + 1;

        if (parseInt(year) < currentYear || 
            (parseInt(year) === currentYear && parseInt(month) < currentMonth)) {
            expiryError.textContent = 'Card has expired';
            expiry.classList.add('is-invalid');
            isValid = false;
        }
    }

    // CVV validation
    const cvvRegex = /^\d{3,4}$/;
    if (!cvvRegex.test(cvv.value)) {
        cvvError.textContent = 'Please enter a valid 3 or 4 digit CVV';
        cvv.classList.add('is-invalid');
        isValid = false;
    }

    return isValid;
}

// Auto-format card number with dashes
document.getElementById('card').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 16) value = value.slice(0, 16);
    let formattedValue = '';
    for (let i = 0; i < value.length; i++) {
        if (i > 0 && i % 4 === 0) formattedValue += '-';
        formattedValue += value[i];
    }
    e.target.value = formattedValue;
});

// Auto-format expiry date with slash
document.getElementById('expiry').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 4) value = value.slice(0, 4);
    if (value.length > 2) {
        value = value.slice(0, 2) + '/' + value.slice(2);
    }
    e.target.value = value;
});

// Only allow numbers in CVV
document.getElementById('cvv').addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/\D/g, '');
});
</script>
{% endblock %}
